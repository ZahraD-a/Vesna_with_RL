syntax = "proto3";

package rl_service;

// gRPC service for RL agent action selection
service RLService {
  // Single action selection (blocking)
  rpc SelectAction(ActionRequest) returns (ActionResponse);

  // Bidirectional streaming for maximum throughput (future optimization)
  rpc SelectActionStream(stream ActionRequest) returns (stream ActionResponse);

  // Agent management
  rpc ResetAgent(ResetRequest) returns (ResetResponse);
  rpc SaveModel(SaveRequest) returns (SaveResponse);
  rpc LoadModel(LoadRequest) returns (LoadResponse);
  rpc GetStats(StatsRequest) returns (StatsResponse);
}

message ActionRequest {
  string agent_id = 1;
  repeated float state = 2;           // State vector (206 floats for 100-region)
  repeated int32 valid_actions = 3;   // Valid action IDs
  float reward = 4;                   // Reward from previous transition
  bool done = 5;                      // Episode done flag
}

message ActionResponse {
  int32 action_id = 1;                // Selected action ID
  string mode = 2;                    // "explore" or "exploit"
  string exploration = 3;             // "epsilon" or "greedy"
  float selected_q = 4;               // Q-value of selected action
  map<int32, float> q_values = 5;     // Q-values for all valid actions
  float epsilon = 6;                  // Current epsilon value
  int32 step_count = 7;               // Total training steps
}

message ResetRequest {
  string agent_id = 1;
}

message ResetResponse {
  bool success = 1;
  string message = 2;
}

message SaveRequest {
  string agent_id = 1;
  string checkpoint_path = 2;
}

message SaveResponse {
  bool success = 1;
  string message = 2;
  string saved_path = 3;
}

message LoadRequest {
  string agent_id = 1;
  string checkpoint_path = 2;
}

message LoadResponse {
  bool success = 1;
  string message = 2;
  int32 episode = 3;
  int32 step = 4;
}

message StatsRequest {
  string agent_id = 1;
}

message StatsResponse {
  int32 episode = 1;
  int32 step = 2;
  float epsilon = 3;
  float avg_loss = 4;
  int32 buffer_size = 5;
  float avg_reward = 6;
}
